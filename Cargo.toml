[package]
name = "local"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
axum = { version = "0.8", features = ["json"]}
tokio = { version = "1", features = ["full"]}
serde = { version = "1", features = ["derive"]}
serde_json = "1"
dotenvy = "0.15"

sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"]}

tracing = "0.1"
tracing-subscriber = "0.3"
sha2 = "0.10"
hex = "0.4"

